<section
    id="projetos"
    class="w-full bg-light px-5 py-14 sm:px-8 sm:py-16 lg:px-12 lg:py-20 xl:px-16"
>

    <div class="mx-auto w-full max-w-7xl">

        <!-- Título da seção -->
        <div class="mb-10 sm:mb-12 lg:mb-14">

            <h2
                class="inline-block border-b-2 border-secondary pb-2 text-3xl font-bold text-dark sm:text-4xl"
            >
                Projetos
            </h2>

            <p
                class="mt-3 text-sm text-slate-500 sm:text-base"
            >
                Confira alguns dos meus trabalhos recentes
            </p>

        </div>


        <!-- Grid dos projetos -->
        <div
            class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3 lg:gap-7 xl:gap-8"
        >

            @for (projeto of projetos; track projeto.nome) {

                <article
                    class="group flex min-h-[420px] flex-col overflow-hidden rounded-xl bg-white shadow-md transition-all duration-300 hover:-translate-y-1 hover:shadow-xl"
                >

                    <!-- Capa do projeto -->
                    <div
                        class="h-48 w-full shrink-0 bg-gradient-to-r from-dark via-secondary to-accent sm:h-52 lg:h-56"
                    >

                        @if (projeto.imagem) {

                            <img
                                [src]="projeto.imagem"
                                [alt]="'Imagem do projeto ' + projeto.nome"
                                class="h-full w-full object-cover"
                            >

                        }

                    </div>


                    <!-- Conteúdo -->
                    <div
                        class="flex flex-1 flex-col p-5 sm:p-6"
                    >

                        <!-- Nome do projeto -->
                        <h3
                            class="text-base font-bold text-dark sm:text-lg"
                        >
                            {{ projeto.nome }}
                        </h3>


                        <!-- Descrição -->
                        <p
                            class="mt-2 text-xs leading-relaxed text-slate-500 sm:text-sm"
                        >
                            {{ projeto.descricao }}
                        </p>


                        <!-- Tecnologias -->
                        <div
                            class="mt-4 flex flex-wrap gap-2"
                        >

                            @for (
                                tecnologia of projeto.tecnologias;
                                track tecnologia
                            ) {

                                <span
                                    class="rounded-full bg-accent/70 px-3 py-1 text-[10px] font-medium text-dark sm:text-xs"
                                >
                                    {{ tecnologia }}
                                </span>

                            }

                        </div>


                        <!-- Links -->
                        <div
                            class="mt-auto flex items-center justify-between pt-6"
                        >

                            <a
                                [href]="projeto.link"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="text-xs font-semibold text-secondary transition-colors hover:text-dark hover:underline sm:text-sm"
                            >
                                Ver Projeto ↗
                            </a>


                            <a
                                [href]="projeto.github"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="text-xs font-semibold text-secondary transition-colors hover:text-dark hover:underline sm:text-sm"
                            >
                                GitHub ↗
                            </a>

                        </div>

                    </div>

                </article>

            }

        </div>

    </div>

</section>
