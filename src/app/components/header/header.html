
<header class="w-full bg-dark text-light">


  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">

    <a
      href="#home"
      class="flex items-center gap-2"
    >
      <!-- ER -->
      <span
        class="flex h-9 w-9 items-center justify-center rounded-md border 
        border-accent text-sm font-semibold text-accent"
      >
        ER
      </span>

      <span class="hidden text-sm font-semibold lg:block">
        Elias Ribeiro
      </span>

      <span class="text-sm font-semibold lg:hidden">
        Elias.dev
      </span>
    </a>


    <nav class="hidden items-center gap-8 lg:flex">

      <a
        href="#home"
        class="relative text-xs text-light transition-colors hover:text-accent
               after:absolute after:-bottom-2 after:left-0 after:h-0.5 after:w-full
               after:bg-accent"
      >
        Home
      </a>

      <a
        href="#sobre"
        class="text-xs text-light transition-colors hover:text-accent"
      >
        Sobre Mim
      </a>

      <a
        href="#projetos"
        class="text-xs text-light transition-colors hover:text-accent"
      >
        Projetos
      </a>

      <a
        href="#certificados"
        class="text-xs text-light transition-colors hover:text-accent"
      >
        Certificados
      </a>

      <a
        href="#contato"
        class="text-xs text-light transition-colors hover:text-accent"
      >
        Contato
      </a>

    </nav>


    <!-- Botão Hamburguer - Mobile / Tablet -->
    <button
      type="button"
      class="flex h-9 w-9 items-center justify-center rounded-md border border-accent/40
             text-light transition-colors hover:bg-secondary/20 lg:hidden"
      (click)="toggleMenu()"
      aria-label="Abrir menu"
    >

      @if (!menuOpen) {

        <svg
          class="h-5 w-5"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>

      } @else {

        <!-- Ícone fechar -->
        <svg
          class="h-5 w-5"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>

      }

    </button>

  </div>


  <!-- Menu Mobile / Tablet -->
  @if (menuOpen) {

    <nav
      class="border-t border-accent/20 bg-dark lg:hidden"
    >

      <a
        href="#home"
        class="block border-b border-accent/20 px-6 py-5 text-sm text-light
               transition-colors hover:bg-secondary/10 hover:text-accent"
        (click)="closeMenu()"
      >
        Home
      </a>

      <a
        href="#sobre"
        class="block border-b border-accent/20 px-6 py-5 text-sm text-light
               transition-colors hover:bg-secondary/10 hover:text-accent"
        (click)="closeMenu()"
      >
        Sobre Mim
      </a>

      <a
        href="#projetos"
        class="block border-b border-accent/20 px-6 py-5 text-sm text-light
               transition-colors hover:bg-secondary/10 hover:text-accent"
        (click)="closeMenu()"
      >
        Projetos
      </a>

      <a
        href="#certificados"
        class="block border-b border-accent/20 px-6 py-5 text-sm text-light
               transition-colors hover:bg-secondary/10 hover:text-accent"
        (click)="closeMenu()"
      >
        Certificados
      </a>

      <a
        href="#contato"
        class="block px-6 py-5 text-sm text-light
               transition-colors hover:bg-secondary/10 hover:text-accent"
        (click)="closeMenu()"
      >
        Contato
      </a>

    </nav>

  }

</header>
