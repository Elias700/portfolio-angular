<section 
  id="certificados" 
  class="
    min-h-screen
    bg-dark
    px-5
    py-14
    sm:px-8
    md:px-10
    lg:px-16
    lg:py-16
  ">

  <div class="mx-auto max-w-7xl">

    <!-- CABEÇALHO -->
    <div class="mb-10 md:mb-12">

      <h2 class="
          text-3xl
          font-bold
          leading-tight
          text-light
          sm:text-4xl
          md:text-5xl
        ">
        Certificados & Licenças
      </h2>

      <p class="
          mt-3
          text-base
          font-medium
          text-accent
          sm:text-lg
        ">
        Formação complementar e especializações
      </p>

    </div>


    <!-- GRID DE CERTIFICADOS -->
    <div class="grid grid-cols-1 gap-5 md:grid-cols-2 md:gap-6">

      @for (certificado of certifications; track certificado.titulo) {

      <article class="
            rounded-2xl
            border
            border-secondary/50
            bg-secondary/20
            p-6
            transition-all
            duration-300
            hover:-translate-y-1
            hover:border-accent/50
            hover:bg-secondary/30
            sm:p-7
          ">

        <!-- ÍCONE -->
        <div 
          class="
            mb-5
            flex
            h-11
            w-11
            items-center
            justify-center
            rounded-lg
            bg-secondary/40
        ">

          <svg 
            class="h-6 w-6 text-accent" 
            viewBox="0 0 24 24" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="2"
            stroke-linecap="round" 
            stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="13" rx="2"></rect>

            <path d="M8 21h8"></path>

            <path d="M12 17v4"></path>
          </svg>

        </div>


        <!-- TÍTULO -->
        <h3 class="
              text-lg
              font-bold
              leading-snug
              text-light
              sm:text-xl
        ">
          {{ certificado.titulo }}
        </h3>


        <!-- INSTITUIÇÃO -->
        <p class="
              mt-1
              text-sm
              text-light/80
              sm:text-base
            ">
          {{ certificado.instituicao }}
        </p>


        <!-- ANO -->
        <p class="
              mt-1
              text-sm
              font-medium
              text-accent
            ">
          {{ certificado.ano }}
        </p>


        <!-- BOTÃO -->
        <button type="button" (click)="abrirCertificado(certificado)" 
            class="
              mt-5
              inline-flex
              cursor-pointer
              items-center
              gap-2
              rounded-lg
              bg-primary
              px-4
              py-2.5
              text-sm
              font-semibold
              text-light
              transition-all
              duration-200
              hover:bg-secondary
              hover:text-light
              focus:outline-none
              focus:ring-2
              focus:ring-accent
              focus:ring-offset-2
              focus:ring-offset-dark
          ">

          <!-- ÍCONE DE VISUALIZAÇÃO -->
          <svg 
            class="h-4 w-4" 
            viewBox="0 0 24 24" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="2"
            stroke-linecap="round" 
            stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>

            <circle cx="12" cy="12" r="3"></circle>
          </svg>

          Ver certificado

        </button>

      </article>

      }

    </div>


    <!-- MODAL -->
    <app-certification-modal 
      [certificado]="certificadoSelecionado" 
      (fechar)="fecharCertificado()" 
    />

  </div>

</section>
